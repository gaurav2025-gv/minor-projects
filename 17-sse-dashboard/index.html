<!DOCTYPE html>
<html>
<head>
    <title>Live Hazard Dashboard</title>

    <style>
        body{
            font-family:Arial;
            margin:40px;
        }

        .event{
            padding:12px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:6px;
        }
    </style>
</head>

<body>

    <h1>🚨 Live Hazard Dashboard</h1>

    <div id="events"></div>

    <script>

        const source=new EventSource("/events");

        source.onmessage=function(event){

            const hazard=JSON.parse(event.data);

            const div=document.createElement("div");

            div.className="event";

            div.innerHTML=
                `<b>${hazard.type}</b>
                - ${hazard.severity}
                - ${hazard.time}`;

            document
                .getElementById("events")
                .prepend(div);
        };

    </script>

</body>
</html>
